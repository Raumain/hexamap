# Banc E2E isolé : base dédiée, jamais la base de développement.
#
#   docker compose -f docker-compose.e2e.yml up -d --build db api proxy
#   docker compose -f docker-compose.e2e.yml run --rm playwright
#   docker compose -f docker-compose.e2e.yml down -v
#
# Pas de service web : Caddy est la bordure TLS du banc et relaie vers l'API, qui
# sert aussi la SPA compilée. L'API tourne dans son image de production
# (NODE_ENV=production), donc la liste blanche CORS est réellement appliquée.
#
# Le banc est servi en HTTPS (`https://hexamap.test`, certificat de l'AC interne
# de Caddy) : un service worker ne s'enregistre que dans un contexte sécurisé,
# et `AUTH_COOKIE_SECURE=true` fait exercer la politique de cookies réellement
# appliquée en production.
name: hexamap-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexamap
      POSTGRES_PASSWORD: hexamap
      POSTGRES_DB: hexamap_e2e
    volumes:
      # Volume dédié : `down -v` le supprime sans toucher à `hexamap_pgdata`.
      - pgdata_e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexamap -d hexamap_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - e2e

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_DIST_DIR: /app/public
      SERVE_WEB: "true"
      DATABASE_URL: postgres://hexamap:hexamap@db:5432/hexamap_e2e
      # Origine unique du banc : le navigateur ne voit que la bordure Caddy, qui
      # relaie vers l'API sur 3000. Les trois valeurs doivent rester identiques
      # pour que Better Auth et CORS voient la même origine.
      APP_URL: https://hexamap.test
      BETTER_AUTH_URL: https://hexamap.test
      FRONTEND_URL: https://hexamap.test
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-32
      # Le banc est réellement en HTTPS : la politique de cookies de production
      # est exercée, pas contournée.
      AUTH_COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: ""
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
      # La suppression de compte est éteinte par défaut (les pages légales ne
      # sont pas définitives). Le banc l'allume pour prouver la cascade : la
      # production garde le `503 ACCOUNT_DELETION_DISABLED`.
      ACCOUNT_DELETION_ENABLED: "true"
    volumes:
      # Les blasons de référence du banc : le seed remplit `blason_url` sur les
      # communes, régions et départements E2E, et l'API les sert depuis ce
      # dossier monté en lecture seule. Sans lui, le Cartel n'a aucun blason à
      # mesurer.
      - ./packages/e2e/fixtures/blasons:/data/blasons:ro
    depends_on:
      db:
        condition: service_healthy
    # L'API n'écoute que sous son nom de service : c'est Caddy qui porte
    # l'origine publique. Si l'API répondait aussi à `hexamap.test`, le DNS
    # rendrait deux adresses et certaines requêtes atteindraient un serveur HTTP
    # simple sur une origine https.
    networks:
      - e2e

  proxy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./scripts/e2e/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      e2e:
        aliases:
          - hexamap.test
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command:
      [
        "sh",
        "-c",
        "bun run --cwd scripts/import e2e:seed && bun packages/e2e/fixtures/market-fixture.ts",
      ]
    environment:
      DATABASE_URL: postgres://hexamap:hexamap@db:5432/hexamap_e2e
    depends_on:
      # L'API applique les migrations avant d'exposer /api/v1/health.
      api:
        condition: service_healthy
    networks:
      - e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["tools"]
    # Même UID/GID que l'hôte : les rapports et traces restent modifiables.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/packages/e2e
    environment:
      CI: "1"
      HOME: /tmp
      E2E_BASE_URL: https://hexamap.test
      E2E_API_URL: http://api:3000
      E2E_FRONTEND_URL: https://hexamap.test
      # `global-setup.ts` sème le combo de La Planche pour le compte qu'il vient
      # d'inscrire : la fixture écrit quatre `user_cards` dans la base du banc,
      # sur le réseau `e2e`, jamais dans la base de développement.
      DATABASE_URL: postgres://hexamap:hexamap@db:5432/hexamap_e2e
    volumes:
      # Dépendances installées dans le conteneur de dev (`bun install`) : la
      # version de @playwright/test et celle des navigateurs de l'image sont
      # alignées sur la même version. Le dépôt entier est monté car le linker
      # isolé de Bun range les paquets dans `node_modules/.bun` à la racine.
      - .:/app
    command: ["npx", "--no-install", "playwright", "test"]
    depends_on:
      api:
        condition: service_healthy
      proxy:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      - e2e

networks:
  e2e:

volumes:
  pgdata_e2e:
    name: hexamap_e2e_pgdata
