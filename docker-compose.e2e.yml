# Banc E2E isolé : base dédiée, jamais la base de développement.
#
#   docker compose -f docker-compose.e2e.yml up -d --build db api
#   docker compose -f docker-compose.e2e.yml run --rm playwright
#   docker compose -f docker-compose.e2e.yml down -v
#
# Pas de service web : l'API est la bordure du banc et sert aussi la SPA
# compilée. L'API tourne dans son image de production (NODE_ENV=production),
# donc la liste blanche CORS est réellement appliquée. Les cookies `Secure` sont
# désactivés uniquement ici : le banc est servi en HTTP simple dans le réseau
# Docker (`AUTH_COOKIE_SECURE=false`).
name: hexamap-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexamap
      POSTGRES_PASSWORD: hexamap
      POSTGRES_DB: hexamap_e2e
    volumes:
      # Volume dédié : `down -v` le supprime sans toucher à `hexamap_pgdata`.
      - pgdata_e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexamap -d hexamap_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - e2e

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_DIST_DIR: /app/public
      SERVE_WEB: "true"
      DATABASE_URL: postgres://hexamap:hexamap@db:5432/hexamap_e2e
      # Origine unique du banc : l'API écoute sur 3000 et sert elle-même la SPA
      # (Nginx écoutait sur 80 avant la Phase 12). Les trois valeurs doivent
      # rester identiques pour que Better Auth et CORS voient la même origine.
      APP_URL: http://hexamap.test:3000
      BETTER_AUTH_URL: http://hexamap.test:3000
      FRONTEND_URL: http://hexamap.test:3000
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-32
      AUTH_COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: ""
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
    depends_on:
      db:
        condition: service_healthy
    # L'API est la bordure du banc : elle porte l'alias `hexamap.test` et sert
    # aussi la SPA compilée.
    networks:
      e2e:
        aliases:
          - hexamap.test

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["bun", "run", "--cwd", "scripts/import", "e2e:seed"]
    environment:
      DATABASE_URL: postgres://hexamap:hexamap@db:5432/hexamap_e2e
    depends_on:
      # L'API applique les migrations avant d'exposer /api/v1/health.
      api:
        condition: service_healthy
    networks:
      - e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["tools"]
    # Même UID/GID que l'hôte : les rapports et traces restent modifiables.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/packages/e2e
    environment:
      CI: "1"
      HOME: /tmp
      E2E_BASE_URL: http://hexamap.test:3000
      E2E_API_URL: http://api:3000
      E2E_FRONTEND_URL: http://hexamap.test:3000
    volumes:
      # Dépendances installées dans le conteneur de dev (`bun install`) : la
      # version de @playwright/test et celle des navigateurs de l'image sont
      # alignées sur la même version. Le dépôt entier est monté car le linker
      # isolé de Bun range les paquets dans `node_modules/.bun` à la racine.
      - .:/app
    command: ["npx", "--no-install", "playwright", "test"]
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    networks:
      - e2e

networks:
  e2e:

volumes:
  pgdata_e2e:
    name: hexamap_e2e_pgdata
