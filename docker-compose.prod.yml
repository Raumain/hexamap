# Stack de production Hexamap : PostgreSQL + un unique conteneur de bordure
# (oven/bun:alpine) qui sert l'API ET la SPA compilée.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Ports publiés : uniquement celui de l'application (8080 par défaut). La base
# n'est joignable que sur le réseau interne Docker.
name: hexamap-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexamap}
      # Mot de passe obligatoire : la valeur de développement `hexamap` est
      # publique, et la laisser par défaut ouvrirait la base de production avec
      # un identifiant connu. `:?` fait échouer `docker compose` avant tout
      # démarrage, comme BETTER_AUTH_SECRET plus bas.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (mot de passe unique de production)}
      POSTGRES_DB: ${POSTGRES_DB:-hexamap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexamap} -d ${POSTGRES_DB:-hexamap}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Journaux bornés (A6) : sans plafond, `restart: unless-stopped` plus un
    # conteneur bavard remplissent le disque de l'hôte, et l'API s'arrête.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Aucun port publié : la base n'est accessible que depuis `api`.
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    # Seul service publié : l'API sert aussi la SPA (WEB_DIST_DIR).
    ports:
      - target: 3000
        published: "${WEB_HOST_PORT:-8080}"
        protocol: tcp
    environment:
      NODE_ENV: production
      PORT: 3000
      # SPA compilée, copiée en `./public` dans l'image.
      WEB_DIST_DIR: /app/public
      SERVE_WEB: "true"
      # Même raison : cette URL embarque le mot de passe de l'étape `db` et ne
      # doit donc pas retomber sur les identifiants de développement.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire (elle embarque le mot de passe de production)}
      # Origine publique du frontend : seule origine autorisée par CORS.
      # `PROD_*` évite la collision avec les valeurs de développement de `.env`.
      APP_URL: ${PROD_APP_URL:-http://localhost:${WEB_HOST_PORT:-8080}}
      BETTER_AUTH_URL: ${PROD_BETTER_AUTH_URL:-http://localhost:${WEB_HOST_PORT:-8080}}
      FRONTEND_URL: ${PROD_FRONTEND_URL:-http://localhost:${WEB_HOST_PORT:-8080}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET est obligatoire (32 caractères minimum)}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # Boutique : toutes optionnelles, une valeur vide ferme la boutique (503).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PACK_500: ${STRIPE_PRICE_PACK_500:-}
      STRIPE_PRICE_PACK_1200: ${STRIPE_PRICE_PACK_1200:-}
      STRIPE_PRICE_PACK_2500: ${STRIPE_PRICE_PACK_2500:-}
      STRIPE_PRICE_PACK_6000: ${STRIPE_PRICE_PACK_6000:-}
    volumes:
      - blasons:/data/blasons:ro
      - importstatus:/data/import-status:ro
    depends_on:
      db:
        condition: service_healthy
    # Journaux bornés (A6) : 10 Mio × 5 fichiers par service, soit 50 Mio au plus.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Deux réseaux obligatoires : `backend` pour joindre `db`, `public` pour que
    # le port publié soit réellement exposé. Un conteneur rattaché uniquement à
    # un réseau `internal: true` ne peut pas publier de port.
    networks:
      - backend
      - public

networks:
  # Réseau interne : la base et l'API ne sont pas joignables depuis l'extérieur.
  backend:
    internal: true
  # Réseau de publication : rattaché à `api` en plus de `backend`, ce qui permet
  # d'exposer son port sur l'hôte (Docker ne publie pas les ports d'un réseau
  # « internal »).
  public:

volumes:
  # Base de production, isolée de celle de développement (`hexamap_pgdata`).
  pgdata:
    name: ${PROD_PGDATA_VOLUME:-hexamap_prod_pgdata}
  # Assets produits hors ligne (blasons SVG) et état de l'import Open Data. Ils
  # ne sont pas dans PostgreSQL : une sauvegarde de la base les manque (A5).
  #
  # Les valeurs par défaut portent le préfixe `prod` : sans cela, le nom explicite
  # `hexamap_blasons` désignait le même volume que la pile de développement, et un
  # hôte pouvait rattacher silencieusement les données d'un environnement à l'autre
  # (A7). Pour partager volontairement un volume entre développement et production,
  # poser `BLASONS_VOLUME=hexamap_blasons` explicitement.
  blasons:
    name: ${BLASONS_VOLUME:-hexamap_prod_blasons}
  importstatus:
    name: ${IMPORT_STATUS_VOLUME:-hexamap_prod_importstatus}
