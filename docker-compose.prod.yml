# Stack de production Hexamap : PostgreSQL + un unique conteneur de bordure
# (oven/bun:alpine) qui sert l'API ET la SPA compilée.
#
# Deux fichiers, deux topologies :
#
#   VPS nu :  docker compose -f docker-compose.prod.yml up -d --build
#   Dokploy : docker compose -f docker-compose.prod.yml -f docker-compose.dokploy.yml up -d
#
# Ce fichier-ci suffit à un VPS nu. Sous Dokploy, `docker-compose.dokploy.yml`
# est un **override** : il rattache `api` au réseau externe de Traefik et ramène
# le port publié sur la boucle locale. Il ne se monte jamais seul.
#
# Ports publiés : uniquement celui de l'application (8080 par défaut), sur
# l'interface choisie par `WEB_BIND_ADDRESS`. La base n'est joignable que sur le
# réseau interne Docker.
name: hexamap-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexamap}
      # Mot de passe obligatoire : la valeur de développement `hexamap` est
      # publique, et la laisser par défaut ouvrirait la base de production avec
      # un identifiant connu. `:?` fait échouer `docker compose` avant tout
      # démarrage, comme BETTER_AUTH_SECRET plus bas.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (mot de passe unique de production)}
      POSTGRES_DB: ${POSTGRES_DB:-hexamap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexamap} -d ${POSTGRES_DB:-hexamap}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Journaux bornés (A6) : sans plafond, `restart: unless-stopped` plus un
    # conteneur bavard remplissent le disque de l'hôte, et l'API s'arrête.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Aucun port publié : la base n'est accessible que depuis `api`.
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    # Seul service publié : l'API sert aussi la SPA (WEB_DIST_DIR).
    #
    # `WEB_BIND_ADDRESS` choisit l'interface d'écoute. `0.0.0.0` par défaut (VPS
    # nu, éventuellement derrière un proxy qui vise le port publié). Sous Dokploy
    # la valeur est `127.0.0.1` : Traefik joint le conteneur par `dokploy-network`,
    # et un port ouvert sur toutes les interfaces contournerait le TLS.
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-8080}:3000"
    # Déclaré pour Traefik, qui adresse le **port du conteneur**. `expose` ne
    # publie rien sur l'hôte : il ne fait qu'inscrire le port dans les métadonnées
    # du conteneur et sur le réseau.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # SPA compilée, copiée en `./public` dans l'image.
      WEB_DIST_DIR: /app/public
      SERVE_WEB: "true"
      # Même raison : cette URL embarque le mot de passe de l'étape `db` et ne
      # doit donc pas retomber sur les identifiants de développement.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est obligatoire (elle embarque le mot de passe de production)}
      # Origine publique du frontend : seule origine autorisée par CORS.
      # `PROD_*` évite la collision avec les valeurs de développement de `.env`.
      #
      # `:?` et non `:-` : un repli `http://localhost:…` satisfait `z.url()`
      # (`apps/api/src/env.ts`), donc l'application démarrerait avec une liste
      # blanche CORS qui n'autorise qu'un hôte local — panne silencieuse, aucune
      # erreur au démarrage. Une valeur absente arrête `docker compose` ici.
      APP_URL: ${PROD_APP_URL:?PROD_APP_URL est obligatoire (origine publique du serveur, ex. https://hexamap.example.com)}
      BETTER_AUTH_URL: ${PROD_BETTER_AUTH_URL:?PROD_BETTER_AUTH_URL est obligatoire (origine publique du serveur, ex. https://hexamap.example.com)}
      FRONTEND_URL: ${PROD_FRONTEND_URL:?PROD_FRONTEND_URL est obligatoire (seule origine autorisée par CORS)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET est obligatoire (32 caractères minimum)}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      # Boutique : ouverte au lancement, donc les six variables sont **exigées**.
      #
      # Une clé absente arrête la pile au lieu de dégrader en `503 SHOP_DISABLED`
      # pendant que l'opérateur croit la boutique en ligne. Le schéma de
      # `apps/api/src/env.ts` les garde optionnelles à dessein : un conteneur de
      # développement sans Stripe doit continuer de tourner.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY est obligatoire (boutique ouverte au lancement)}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET est obligatoire (boutique ouverte au lancement)}
      STRIPE_PRICE_PACK_500: ${STRIPE_PRICE_PACK_500:?STRIPE_PRICE_PACK_500 est obligatoire (boutique ouverte au lancement)}
      STRIPE_PRICE_PACK_1200: ${STRIPE_PRICE_PACK_1200:?STRIPE_PRICE_PACK_1200 est obligatoire (boutique ouverte au lancement)}
      STRIPE_PRICE_PACK_2500: ${STRIPE_PRICE_PACK_2500:?STRIPE_PRICE_PACK_2500 est obligatoire (boutique ouverte au lancement)}
      STRIPE_PRICE_PACK_6000: ${STRIPE_PRICE_PACK_6000:?STRIPE_PRICE_PACK_6000 est obligatoire (boutique ouverte au lancement)}
    volumes:
      - blasons:/data/blasons:ro
      - importstatus:/data/import-status:ro
    depends_on:
      db:
        condition: service_healthy
    # Journaux bornés (A6) : 10 Mio × 5 fichiers par service, soit 50 Mio au plus.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Deux réseaux obligatoires : `backend` pour joindre `db`, `public` pour que
    # le port publié soit réellement exposé. Un conteneur rattaché uniquement à
    # un réseau `internal: true` ne peut pas publier de port.
    networks:
      - backend
      - public

networks:
  # Réseau interne : la base et l'API ne sont pas joignables depuis l'extérieur.
  backend:
    internal: true
  # Réseau de publication : rattaché à `api` en plus de `backend`, ce qui permet
  # d'exposer son port sur l'hôte (Docker ne publie pas les ports d'un réseau
  # « internal »).
  public:

volumes:
  # Base de production, isolée de celle de développement (`hexamap_pgdata`).
  pgdata:
    name: ${PROD_PGDATA_VOLUME:-hexamap_prod_pgdata}
  # Assets produits hors ligne (blasons SVG) et état de l'import Open Data. Ils
  # ne sont pas dans PostgreSQL : une sauvegarde de la base les manque (A5).
  #
  # Les valeurs par défaut portent le préfixe `prod` : sans cela, le nom explicite
  # `hexamap_blasons` désignait le même volume que la pile de développement, et un
  # hôte pouvait rattacher silencieusement les données d'un environnement à l'autre
  # (A7). Pour partager volontairement un volume entre développement et production,
  # poser `BLASONS_VOLUME=hexamap_blasons` explicitement.
  blasons:
    name: ${BLASONS_VOLUME:-hexamap_prod_blasons}
  importstatus:
    name: ${IMPORT_STATUS_VOLUME:-hexamap_prod_importstatus}
