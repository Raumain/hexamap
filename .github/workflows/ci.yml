name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexamap
          POSTGRES_PASSWORD: hexamap
          POSTGRES_DB: hexamap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexamap -d hexamap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Pas de DATABASE_URL ici : le gatekeeper refuse une base de test identique
      # à la base de développement, et l'étape « Base de données » comme les
      # spécifications reçoivent DATABASE_URL = TEST_DATABASE_URL juste avant
      # leur exécution (scripts/ci-check.ts).
      TEST_DATABASE_URL: postgres://hexamap:hexamap@localhost:5432/hexamap_test
      # Variables exigées par `apps/api/src/env.ts` dès qu'une spécification
      # importe l'application. Valeurs de CI uniquement : aucun secret réel.
      APP_URL: http://localhost:5174
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-hexamap-secret-not-for-production-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Gatekeeper qualité
        run: bun run ci:check
