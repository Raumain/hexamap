# Override Dokploy — à combiner avec `docker-compose.prod.yml`, jamais seul :
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.dokploy.yml up -d
#
# Dokploy construit `Dockerfile` (cible `prod`), exécute cette pile et place
# Traefik devant elle. Traefik termine le TLS et joint les services par le réseau
# externe `dokploy-network`, sur le **port du conteneur** (3000) — pas sur un
# port publié de l'hôte.
#
# Ce fichier n'existe que pour cette topologie. Un VPS nu continue d'utiliser
# `docker-compose.prod.yml` seul : il ne dépend donc pas de l'existence de
# `dokploy-network`, qui est créé par Dokploy avant le premier déploiement.

services:
  api:
    # `!override` **remplace** la liste de `docker-compose.prod.yml` au lieu de
    # s'y ajouter. Compose concatène les séquences `ports` d'un override : deux
    # liaisons sur le même port d'hôte échouent au démarrage (« address already
    # in use »). Le port reste publié sur l'hôte, mais sur la boucle locale
    # seulement — c'est-à-dire que `WEB_BIND_ADDRESS` vaut effectivement
    # `127.0.0.1` sous Dokploy. Traefik ne l'utilise pas : il parle au conteneur
    # par `dokploy-network`, et un port ouvert sur `0.0.0.0` contournerait le TLS
    # depuis l'extérieur (le cookie de session est `Secure` : la connexion en
    # clair semblerait réussir sans jamais persister).
    ports: !override
      - target: 3000
        published: "${WEB_HOST_PORT:-8080}"
        host_ip: "${WEB_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    # `db` n'entre jamais ici : il reste sur `backend` seul, inaccessible depuis
    # le réseau de Traefik. Les réseaux d'un service se fusionnent par nom, donc
    # `backend` (déclaré dans `docker-compose.prod.yml`) reste attaché.
    networks:
      - backend
      - dokploy-network
    # ROUTAGE — propriété du dépôt, pas de l'interface Dokploy.
    #
    # Le déploiement Compose de Dokploy n'injecte aucun label Traefik : sans ce
    # bloc, le conteneur est sain et présent sur `dokploy-network`, mais aucun
    # routeur n'existe et Traefik répond 404 sur le domaine. Ces labels sont donc
    # la seule source du routage.
    #
    # Conséquence directe : le domaine ne doit PAS être déclaré aussi dans
    # l'onglet « Domains » de Dokploy. Deux routeurs sur la même règle rendent le
    # comportement indéfini. Si l'opérateur préfère l'interface, il doit retirer
    # ce bloc `labels` — jamais le laisser en place à côté.
    #
    # `PUBLIC_HOST` est la seule source de vérité du nom d'hôte, exigée par `:?` :
    # une valeur absente fait échouer l'interpolation au lieu de produire un
    # routeur `Host()` vide qui ne correspond à aucune requête.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur trois réseaux (`backend`, `public`,
      # `dokploy-network`) : sans cette épingle, Traefik peut élire l'IP d'un
      # réseau qu'il ne partage pas et la requête n'aboutit jamais.
      traefik.docker.network: "dokploy-network"
      # PRIORITÉ EXPLICITE — à ne jamais retirer.
      #
      # La priorité par défaut d'un routeur Traefik EST la longueur de sa règle.
      # Deux `Host()` identiques ont donc la même longueur, donc la même priorité :
      # l'arbitrage entre les deux est indéterminé. C'est exactement ce que produit
      # un domaine encore déclaré dans l'onglet « Domains » de Dokploy, qui génère
      # une paire `hexamap-app-*-*` sur la même règle : selon l'ordre de lecture,
      # elle gagne et réécrit le chemin, d'où un `ROUTE_NOT_FOUND` sur
      # `/api/v1/health` alors que le conteneur est sain.
      #
      # 100 est supérieur à la longueur de règle de tout `Host()` plausible : les
      # routeurs du dépôt reprennent la main sur tout routeur généré par Dokploy.
      # La suppression du domaine dans l'interface reste la correction de fond ; ce
      # verrou garantit qu'un domaine recréé par erreur ne puisse plus l'emporter.
      traefik.http.routers.hexamap-websecure.priority: "100"
      # HTTPS : le routeur qui termine le TLS, avec le résolveur de Dokploy.
      traefik.http.routers.hexamap-websecure.rule: "Host(`${PUBLIC_HOST:?PUBLIC_HOST est obligatoire (nom d'hôte public, ex. hexamap.example.fr)}`)"
      traefik.http.routers.hexamap-websecure.entrypoints: "websecure"
      traefik.http.routers.hexamap-websecure.tls: "true"
      traefik.http.routers.hexamap-websecure.tls.certresolver: "letsencrypt"
      traefik.http.routers.hexamap-websecure.service: "hexamap"
      # HTTP : redirige vers HTTPS, il ne sert jamais de contenu en clair.
      # Même priorité que `hexamap-websecure` (voir le commentaire ci-dessus) : les
      # deux routeurs du dépôt doivent l'emporter ensemble, jamais un seul.
      traefik.http.routers.hexamap-web.priority: "100"
      traefik.http.routers.hexamap-web.rule: "Host(`${PUBLIC_HOST:?PUBLIC_HOST est obligatoire (nom d'hôte public, ex. hexamap.example.fr)}`)"
      traefik.http.routers.hexamap-web.entrypoints: "web"
      traefik.http.routers.hexamap-web.middlewares: "hexamap-redirect"
      traefik.http.middlewares.hexamap-redirect.redirectscheme.scheme: "https"
      # Port du **conteneur**, pas le port publié sur l'hôte.
      traefik.http.services.hexamap.loadbalancer.server.port: "3000"

networks:
  # Réseau géré par Dokploy, créé avant le déploiement de la pile. `external: true`
  # ne peut pas vivre dans `docker-compose.prod.yml` : un VPS sans Dokploy
  # refuserait de démarrer sur un réseau qui n'existe pas.
  dokploy-network:
    external: true
    name: dokploy-network
