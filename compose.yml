name: hexamap

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexamap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexamap}
      POSTGRES_DB: ${POSTGRES_DB:-hexamap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexamap} -d ${POSTGRES_DB:-hexamap}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # PostgreSQL reste isolé sur le réseau interne : aucune route vers le LAN.
    # Le port n'est publié que sur la boucle locale de l'hôte, pour les outils de
    # vérification (DBeaver, psql, pgAdmin). `${POSTGRES_HOST_PORT:-}` vide
    # n'expose rien ; `127.0.0.1:5432` est la valeur par défaut en développement.
    # `localhost` résout souvent en ::1 : on publie sur l'IPv4 ET l'IPv6 de la
    # boucle locale. Jamais sur le LAN par défaut.
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        host_ip: "${POSTGRES_BIND:-127.0.0.1}"
        protocol: tcp
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        host_ip: "::1"
        protocol: tcp
    networks:
      - backend
      - admin

  # Service utilitaire : toutes les commandes Bun passent par le conteneur.
  # Exemple : docker compose --profile tools run --rm dev bun install
  # Sur frontend (accès Internet pour `bun install`) ET backend (accès à `db`
  # pour `db:migrate`).
  dev:
    image: oven/bun:1
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /app
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - blasons:/data/blasons
      - importstatus:/data/import-status
    command: ["bun", "--version"]
    networks:
      - frontend
      - backend

  # Interface SQL web, optionnelle, pour inspecter la base en développement.
  # Démarrage : docker compose --profile admin up -d pgadmin
  # Accès : http://localhost:5050 (serveur « Hexamap (local) » déjà configuré).
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hexamap.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-hexamap}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    # Écoute uniquement sur la boucle locale de l'hôte (IPv4 + IPv6) : jamais sur le LAN.
    ports:
      - target: 80
        published: "${PGADMIN_HOST_PORT:-5050}"
        host_ip: "127.0.0.1"
        protocol: tcp
      - target: 80
        published: "${PGADMIN_HOST_PORT:-5050}"
        host_ip: "::1"
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - admin

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /app
      DATABASE_URL: ${DATABASE_URL:-postgres://hexamap:hexamap@db:5432/hexamap}
      BLASONS_DIR: /data/blasons
      IMPORT_STATUS_DIR: /data/import-status
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - blasons:/data/blasons
      - importstatus:/data/import-status
    command: ["bun", "run", "--cwd", "apps/api", "dev"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      HOME: /app
      # Cible du proxy Vite (résolution interne Docker). Jamais exposée au navigateur.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    command: ["bun", "run", "--cwd", "apps/web", "dev", "--host", "0.0.0.0"]
    ports:
      - "5174:5174"
    depends_on:
      - api
    networks:
      - frontend

networks:
  # Réseau de bord : accessible depuis le LAN via les ports publiés (5174, 3000).
  frontend:
  # Réseau interne : aucune route vers l'extérieur, aucun port publié. La DB
  # n'est joignable que par les services qui y sont rattachés.
  backend:
    internal: true
  # Réseau de pont réservé aux outils de vérification (pgAdmin, DBeaver).
  # Docker ne publie pas les ports d'un conteneur présent uniquement sur un
  # réseau « internal » : ce réseau permet donc la publication, mais les ports
  # sont explicitement liés à 127.0.0.1 (boucle locale), jamais au LAN.
  admin:

volumes:
  pgdata:
  pgadmin:
  # Blasons SVG produits hors ligne par le pipeline d'import (scripts/import).
  blasons:
  # Fichier d'état de l'import Open Data, écrit par `dev`, lu par `api`.
  importstatus:
