<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1210" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hexamap" />
    <!--
      Repli de marque : le titre et la description de la page visitée sont posés
      au rendu par `apps/web/src/lib/seo.ts`. Ces deux balises servent au shell
      avant l'exécution du JavaScript — et au repli SPA.
    -->
    <meta
      name="description"
      content="Hexamap — le cabinet de cartographie. Collectionnez les régions, départements, communes et rues de France."
    />
    <!--
      Identité de marque (I-005). `url` et `@id` sont volontairement absents : un
      fichier statique ne peut pas connaître l'origine canonique, et en inventer
      une est interdit. Ils rejoindront le graphe le jour où le prérendu rendra
      l'origine connue côté serveur — même raison que la canonique.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Hexamap",
            "description": "Le cabinet de cartographie : un jeu de collection de lieux réels de France."
          },
          {
            "@type": "WebSite",
            "name": "Hexamap",
            "inLanguage": "fr",
            "description": "Collectionnez les régions, départements, communes et rues de France."
          }
        ]
      }
    </script>
    <link rel="preload" href="/fonts/Fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/InstrumentSans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script defer src="https://stats.hexamap.fr/script.js" data-website-id="7e7ae756-b061-483e-b979-a0d76e5710a5"></script>
    <title>Hexamap — Cabinet de cartographie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
